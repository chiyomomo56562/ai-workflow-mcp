[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-mcp"
version = "0.1.0"
description = "MCP server for managing Codex development workflows"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.0.0,<3.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
workflow-mcp = "workflow_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
